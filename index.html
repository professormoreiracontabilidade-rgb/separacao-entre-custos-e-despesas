<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Curso de Contabilidade Professor Moreira</title>
<style>

<script>
const slides = [{"title": "Contabilidade de Custos", "body": "\n        <div class=\"coverBox\">\n          <div class=\"bigIcon\">📘</div>\n          <h1>Contabilidade de Custos</h1>\n          <h2>Separação entre Custos e Despesas</h2>\n          <p>Treinamento para o Exame do CFC</p>\n          <div class=\"focus\">Resolva em seu caderno.</div>\n        </div>\n        "}, {"title": "Indústria Alfa S.A.", "body": "\n        <p class=\"statement\">As questões de <strong>01 e 02</strong> baseiam-se nos dados da tabela abaixo, referente aos gastos do mês da <strong>Indústria Alfa S.A.</strong>:</p>\n        <table class=\"dataTable\">\n          <tr><th>Item</th><th>Gastos do mês – Custos de Produção e Despesas</th><th>Valor (R$)</th></tr>\n          <tr><td>01</td><td>Matérias-primas consumidas no processo produtivo</td><td>500.000,00</td></tr>\n          <tr><td>02</td><td>Salários e encargos do pessoal da fábrica</td><td>250.000,00</td></tr>\n          <tr><td>03</td><td>Depreciação das máquinas da fábrica (linha reta)</td><td>60.000,00</td></tr>\n          <tr><td>04</td><td>Aluguel do prédio da administração geral</td><td>45.000,00</td></tr>\n          <tr><td>05</td><td>Comissões dos vendedores sobre as vendas do mês</td><td>30.000,00</td></tr>\n          <tr><td>06</td><td>Energia elétrica consumida na área de produção</td><td>35.000,00</td></tr>\n          <tr><td>07</td><td>Salários e encargos da diretoria comercial e administrativa</td><td>120.000,00</td></tr>\n          <tr><td>08</td><td>Aluguel do prédio da fábrica</td><td>80.000,00</td></tr>\n          <tr><td>09</td><td>Seguros da área administrativa da empresa</td><td>15.000,00</td></tr>\n          <tr><td>10</td><td>Material de embalagem utilizado no setor de expedição/vendas</td><td>12.000,00</td></tr>\n          <tr><td>11</td><td>Juros e despesas financeiras de empréstimos</td><td>25.000,00</td></tr>\n          <tr><td>12</td><td>Tributos incidentes sobre o faturamento (vendas)</td><td>180.000,00</td></tr>\n          <tr><td>13</td><td>Manutenção preventiva dos equipamentos da fábrica</td><td>18.000,00</td></tr>\n        </table>\n        "}, {"title": "Questão 01", "body": "\n        <div class=\"questionBox\">\n          <h2>O total dos Custos de Produção do período é:</h2>\n          <div class=\"alts\">\n            <p>a) R$ 843.000,00</p>\n            <p>b) R$ 925.000,00</p>\n            <p>c) R$ 943.000,00</p>\n            <p>d) R$ 1.123.000,00</p>\n            <p>e) R$ 1.390.000,00</p>\n          </div>\n        </div>\n        "}, {"title": "Questão 02", "body": "\n        <div class=\"questionBox\">\n          <h2>O montante total das Despesas (comerciais, administrativas e financeiras) representa:</h2>\n          <div class=\"alts\">\n            <p>a) R$ 222.000,00</p>\n            <p>b) R$ 397.000,00</p>\n            <p>c) R$ 422.000,00</p>\n            <p>d) R$ 447.000,00</p>\n            <p>e) R$ 510.000,00</p>\n          </div>\n        </div>\n        "}, {"title": "Gabarito Comentado – Questões 01 e 02", "body": "\n        <div class=\"twoSolutions\">\n          <div class=\"solutionCard cost\">\n            <h2>✅ Questão 01 – Custos</h2>\n            <table class=\"calcTable compact\">\n              <tr><th>Item</th><th>Valor</th></tr>\n              <tr><td>01 – Matérias-primas</td><td>500.000</td></tr>\n              <tr><td>02 – Pessoal da fábrica</td><td>250.000</td></tr>\n              <tr><td>03 – Depreciação das máquinas</td><td>60.000</td></tr>\n              <tr><td>06 – Energia da produção</td><td>35.000</td></tr>\n              <tr><td>08 – Aluguel da fábrica</td><td>80.000</td></tr>\n              <tr><td>13 – Manutenção dos equipamentos</td><td>18.000</td></tr>\n              <tr class=\"total\"><td>Total dos Custos</td><td>943.000</td></tr>\n            </table>\n            <div class=\"answerLine\">Gabarito: <strong>C</strong> — R$ 943.000,00</div>\n          </div>\n          <div class=\"solutionCard expense\">\n            <h2>❌ Questão 02 – Despesas</h2>\n            <table class=\"calcTable compact\">\n              <tr><th>Item</th><th>Valor</th></tr>\n              <tr><td>04 – Administração geral</td><td>45.000</td></tr>\n              <tr><td>05 – Comissões de vendedores</td><td>30.000</td></tr>\n              <tr><td>07 – Diretoria comercial/admin.</td><td>120.000</td></tr>\n              <tr><td>09 – Seguro administrativo</td><td>15.000</td></tr>\n              <tr><td>10 – Expedição/vendas</td><td>12.000</td></tr>\n              <tr><td>11 – Juros e despesas financeiras</td><td>25.000</td></tr>\n              <tr><td>12 – Tributos sobre vendas</td><td>180.000</td></tr>\n              <tr class=\"total\"><td>Total das Despesas</td><td>427.000</td></tr>\n            </table>\n            <div class=\"answerLine\">Total técnico: <strong>R$ 427.000,00</strong></div>\n          </div>\n        </div>\n        "}, {"title": "Indústria Metalúrgica Delta S.A.", "body": "\n        <p class=\"statement\">As questões de <strong>03 e 04</strong> baseiam-se nos dados abaixo, referentes aos gastos do mês da <strong>Indústria Metalúrgica Delta S.A.</strong>:</p>\n        <table class=\"dataTable\">\n          <tr><th>Item</th><th>Gastos do mês – Custos de Produção e Despesas</th><th>Valor (R$)</th></tr>\n          <tr><td>01</td><td>Componentes e matérias-primas aplicados na linha de montagem</td><td>620.000,00</td></tr>\n          <tr><td>02</td><td>Aluguel do escritório central de vendas e administração</td><td>55.000,00</td></tr>\n          <tr><td>03</td><td>Seguro anual das instalações da fábrica (fração mensal)</td><td>12.000,00</td></tr>\n          <tr><td>04</td><td>Salários e encargos dos operários da fábrica</td><td>410.000,00</td></tr>\n          <tr><td>05</td><td>Salários do pessoal do departamento de faturamento e cobrança</td><td>45.000,00</td></tr>\n          <tr><td>06</td><td>Honorários da diretoria financeira e administrativa</td><td>70.000,00</td></tr>\n          <tr><td>07</td><td>Lubrificantes e materiais de consumo das máquinas de produção</td><td>8.500,00</td></tr>\n          <tr><td>08</td><td>Depreciação do prédio onde funciona a fábrica</td><td>50.000,00</td></tr>\n          <tr><td>09</td><td>Depreciação dos computadores da sede administrativa</td><td>14.000,00</td></tr>\n          <tr><td>10</td><td>Fretes pagos para a entrega de produtos vendidos aos clientes</td><td>19.000,00</td></tr>\n          <tr><td>11</td><td>Energia elétrica consumida no pavilhão industrial</td><td>42.000,00</td></tr>\n          <tr><td>12</td><td>Propaganda e publicidade institucional dos produtos</td><td>28.000,00</td></tr>\n          <tr><td>13</td><td>Encargos financeiros sobre empréstimos bancários</td><td>33.000,00</td></tr>\n        </table>\n        "}, {"title": "Questão 03", "body": "\n        <div class=\"questionBox\">\n          <h2>O total dos gastos de produção (Custos) da Indústria Delta no mês é:</h2>\n          <div class=\"alts\">\n            <p>a) R$ 1.030.000,00</p>\n            <p>b) R$ 1.090.500,00</p>\n            <p>c) R$ 1.142.500,00</p>\n            <p>d) R$ 1.154.500,00</p>\n            <p>e) R$ 1.418.500,00</p>\n          </div>\n        </div>\n        "}, {"title": "Questão 04", "body": "\n        <div class=\"questionBox\">\n          <h2>O montante das despesas (comerciais, administrativas e financeiras) representa:</h2>\n          <div class=\"alts\">\n            <p>a) R$ 231.000,00</p>\n            <p>b) R$ 245.000,00</p>\n            <p>c) R$ 264.000,00</p>\n            <p>d) R$ 276.000,00</p>\n            <p>e) R$ 297.000,00</p>\n          </div>\n        </div>\n        "}, {"title": "Gabarito Comentado – Questões 03 e 04", "body": "\n        <div class=\"twoSolutions\">\n          <div class=\"solutionCard cost\">\n            <h2>✅ Questão 03 – Custos</h2>\n            <table class=\"calcTable compact\">\n              <tr><th>Item</th><th>Valor</th></tr>\n              <tr><td>01 – Componentes e matérias-primas</td><td>620.000</td></tr>\n              <tr><td>03 – Seguro da fábrica</td><td>12.000</td></tr>\n              <tr><td>04 – Operários da fábrica</td><td>410.000</td></tr>\n              <tr><td>07 – Lubrificantes da produção</td><td>8.500</td></tr>\n              <tr><td>08 – Depreciação do prédio fabril</td><td>50.000</td></tr>\n              <tr><td>11 – Energia do pavilhão industrial</td><td>42.000</td></tr>\n              <tr class=\"total\"><td>Total dos Custos</td><td>1.142.500</td></tr>\n            </table>\n            <div class=\"answerLine\">Gabarito: <strong>C</strong> — R$ 1.142.500,00</div>\n          </div>\n          <div class=\"solutionCard expense\">\n            <h2>❌ Questão 04 – Despesas</h2>\n            <table class=\"calcTable compact\">\n              <tr><th>Item</th><th>Valor</th></tr>\n              <tr><td>02 – Vendas e administração</td><td>55.000</td></tr>\n              <tr><td>05 – Faturamento e cobrança</td><td>45.000</td></tr>\n              <tr><td>06 – Diretoria financeira/admin.</td><td>70.000</td></tr>\n              <tr><td>09 – Sede administrativa</td><td>14.000</td></tr>\n              <tr><td>10 – Fretes de entrega</td><td>19.000</td></tr>\n              <tr><td>12 – Propaganda e publicidade</td><td>28.000</td></tr>\n              <tr><td>13 – Encargos financeiros</td><td>33.000</td></tr>\n              <tr class=\"total\"><td>Total das Despesas</td><td>264.000</td></tr>\n            </table>\n            <div class=\"answerLine\">Gabarito: <strong>C</strong> — R$ 264.000,00</div>\n          </div>\n        </div>\n        "}, {"title": "Mapa Rápido de Fixação", "body": "\n        <div class=\"summaryCards\">\n          <div class=\"miniCard cost\">\n            <h2>✅ CUSTO</h2>\n            <p>Está ligado à fábrica, produção ou transformação do produto.</p>\n            <ul>\n              <li>Matéria-prima</li>\n              <li>Mão de obra da fábrica</li>\n              <li>Depreciação das máquinas</li>\n              <li>Energia da produção</li>\n              <li>Aluguel da fábrica</li>\n              <li>Manutenção da produção</li>\n            </ul>\n          </div>\n          <div class=\"miniCard expense\">\n            <h2>❌ DESPESA</h2>\n            <p>Está ligada à administração, vendas, financeiro ou entrega ao cliente.</p>\n            <ul>\n              <li>Comissões de vendedores</li>\n              <li>Administração geral</li>\n              <li>Diretoria administrativa</li>\n              <li>Propaganda</li>\n              <li>Juros e encargos financeiros</li>\n              <li>Frete para entrega ao cliente</li>\n            </ul>\n          </div>\n        </div>\n        "}];
let idx = Number(localStorage.getItem("pm_custos_v2_idx") || 0);
const slideTitle=document.getElementById("slideTitle"), slideCount=document.getElementById("slideCount"), content=document.getElementById("content");
function renderSlide(){idx=Math.max(0,Math.min(idx,slides.length-1));slideTitle.textContent=slides[idx].title;slideCount.textContent=`Tela ${idx+1} de ${slides.length}`;content.innerHTML=slides[idx].body;localStorage.setItem("pm_custos_v2_idx",idx);loadBoardForSlide();}
function nextSlide(){saveBoardForSlide();idx=(idx+1)%slides.length;renderSlide();} function prevSlide(){saveBoardForSlide();idx=(idx-1+slides.length)%slides.length;renderSlide();} function restartAll(){saveBoardForSlide();idx=0;renderSlide();}
document.getElementById("next").onclick=nextSlide;document.getElementById("prev").onclick=prevSlide;document.getElementById("restart").onclick=restartAll;document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nextSlide();if(e.key==="ArrowLeft")prevSlide();});
const wrap=document.getElementById("boardWrap"), canvas=document.getElementById("board"), guide=document.getElementById("guide"), ctx=canvas.getContext("2d"), gctx=guide.getContext("2d"), statusEl=document.getElementById("status"), sizeInput=document.getElementById("size");
let tool="pen", color="#1368d8", width=4, drawing=false, highlighter=false, startPoint=null, lastPoint=null, autoSaveTimer=null;
function resizeCanvas(){const current=canvas.width?canvas.toDataURL("image/png"):null;canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;guide.width=wrap.clientWidth;guide.height=wrap.clientHeight;ctx.lineCap="round";ctx.lineJoin="round";if(current){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=current;}}
resizeCanvas();window.addEventListener("resize",()=>{saveBoardForSlide();resizeCanvas();setTimeout(loadBoardForSlide,80);});
function saveBoardForSlide(){try{localStorage.setItem("pm_custos_v2_board_"+idx,canvas.toDataURL("image/png"));}catch(e){}}
function loadBoardForSlide(){clearBoardOnly();const data=localStorage.getItem("pm_custos_v2_board_"+idx);if(data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=data;}}
function pnt(e){const r=canvas.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};}
function setActive(id){document.querySelectorAll(".tool").forEach(b=>b.classList.remove("active"));if(id)document.getElementById(id).classList.add("active");} function setStatus(s){statusEl.textContent=s;}
function usePen(c,id,name,hl=false){tool="pen";color=c;highlighter=hl;setActive(id);setStatus(name+" selecionada");}
document.getElementById("penBlue").onclick=()=>usePen("#1368d8","penBlue","Caneta azul");document.getElementById("penRed").onclick=()=>usePen("#dc2626","penRed","Caneta vermelha");document.getElementById("penBlack").onclick=()=>usePen("#111827","penBlack","Caneta preta");document.getElementById("highlighter").onclick=()=>usePen("#facc15","highlighter","Marca-texto amarelo",true);
document.getElementById("eraser").onclick=()=>{tool="eraser";highlighter=false;setActive("eraser");setStatus("Borracha selecionada");};document.getElementById("rulerH").onclick=()=>{tool="rulerH";highlighter=false;setActive("rulerH");setStatus("Régua H selecionada");};document.getElementById("rulerV").onclick=()=>{tool="rulerV";highlighter=false;setActive("rulerV");setStatus("Régua V selecionada");};
document.getElementById("clear").onclick=()=>{clearBoardOnly();localStorage.removeItem("pm_custos_v2_board_"+idx);setStatus("Anotações apagadas");};sizeInput.oninput=()=>{width=Number(sizeInput.value);};
function drawStraight(t,p1,p2){t.save();t.globalCompositeOperation="source-over";t.strokeStyle=color;t.globalAlpha=highlighter?.42:1;t.lineWidth=highlighter?Math.max(width,14):width;t.lineCap="round";t.beginPath();t.moveTo(p1.x,p1.y);t.lineTo(p2.x,p2.y);t.stroke();t.restore();}
function clearGuide(){gctx.clearRect(0,0,guide.width,guide.height);} function start(e){e.preventDefault();drawing=true;const p=pnt(e);startPoint=p;lastPoint=p;if(tool!=="rulerH"&&tool!=="rulerV"){ctx.beginPath();ctx.moveTo(p.x,p.y);}}
function move(e){if(!drawing)return;e.preventDefault();let p=pnt(e);if(tool==="rulerH"||tool==="rulerV"){clearGuide();if(tool==="rulerH")p={x:p.x,y:startPoint.y};if(tool==="rulerV")p={x:startPoint.x,y:p.y};lastPoint=p;drawStraight(gctx,startPoint,p);return;}if(tool==="eraser"){ctx.globalCompositeOperation="destination-out";ctx.lineWidth=Math.max(20,width*3);}else{ctx.globalCompositeOperation="source-over";ctx.strokeStyle=color;ctx.globalAlpha=highlighter?.42:1;ctx.lineWidth=highlighter?Math.max(width,14):width;}ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalAlpha=1;scheduleSave();}
function stop(){if(!drawing)return;if(tool==="rulerH"||tool==="rulerV"){clearGuide();drawStraight(ctx,startPoint,lastPoint);}drawing=false;ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;saveBoardForSlide();} function clearBoardOnly(){ctx.clearRect(0,0,canvas.width,canvas.height);clearGuide();} function scheduleSave(){clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(saveBoardForSlide,250);}
canvas.addEventListener("mousedown",start);canvas.addEventListener("mousemove",move);window.addEventListener("mouseup",stop);canvas.addEventListener("touchstart",start,{passive:false});canvas.addEventListener("touchmove",move,{passive:false});window.addEventListener("touchend",stop);window.addEventListener("beforeunload",saveBoardForSlide);
renderSlide();
</script>
</body></html>
